<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="A simple media page featuring a video lesson and a relaxing audio track.">
  <title>HTML Audio and Video Player</title>
</head>
<body>
  <main>
    <h1>Media Lounge</h1>

    <section>
      <h2>How the JavaScript Map Method Works</h2>
      <video controls width="640">
        <source
          src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
          type="video/mp4">
      </video>
    </section>

    <section>
      <h2>Sailing Away</h2>
      <audio
        controls
        loop
        src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3">
      </audio>
    </section>
  </main>
</body>
</html>
