<body>
  <h1>Checkout</h1>

  <section>
    <h2>Your Cart</h2>
    <img
      src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
      alt="A colorful cube"
    >
    <p>Colorful Cube — $25.00</p>
  </section>

  <section>
    <h2>Payment Information</h2>

    <form>
      <label for="card-name">
        Cardholder Name
        <span aria-hidden="true">*</span>
      </label>
      <input
        type="text"
        id="card-name"
        name="card-name"
        required
      >

      <label for="card-number">
        Card Number
        <span aria-hidden="true">*</span>
      </label>
      <input
        type="text"
        id="card-number"
        name="card-number"
        aria-describedby="card-number-help"
        required
      >
      <p id="card-number-help">Enter your 16-digit card number.</p>

      <button type="submit">Pay Now</button>
    </form>
  </section>
</body>
